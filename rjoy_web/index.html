<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJoy</title>
    <script src="htmx.js.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <header>
        <h1>RJoy</h1>
    </header>

    <section class="card">
        <div class="conn-bar">
            <span id="conn-dot" class="dot unknown"></span>
            <span id="conn-label">Connecting…</span>
        </div>
        <div id="stats"
             hx-get="/status"
             hx-trigger="every 1s"
             hx-swap="innerHTML">
        </div>
    </section>

    <section class="card">
        <div class="profile-bar">
            <span class="section-label">PROFILES</span>
            <div id="profile-btns"
                 class="profile-btn-row"
                 hx-get="/profiles"
                 hx-trigger="load"
                 hx-swap="innerHTML">
            </div>
            <button class="icon-btn"
                    hx-get="/profiles"
                    hx-target="#profile-btns"
                    hx-swap="innerHTML"
                    title="Refresh profiles">↺</button>
        </div>
    </section>

    <div id="controls"></div>
</main>

<script>
    // ── Status polling ────────────────────────────────────────────────────────
    document.body.addEventListener("htmx:afterSwap", function (e) {
        if (e.detail.target.id !== "stats") return;
        document.getElementById("conn-dot").className = "dot green";
        document.getElementById("conn-label").textContent = "Connected";
    });
    ["htmx:sendError", "htmx:responseError"].forEach(function (evt) {
        document.body.addEventListener(evt, function (e) {
            if (e.detail.target.id !== "stats") return;
            document.getElementById("conn-dot").className = "dot red";
            document.getElementById("conn-label").textContent = "Disconnected";
        });
    });

    // ── Active profile highlight ──────────────────────────────────────────────
    document.body.addEventListener("htmx:afterRequest", function (e) {
        if (!e.detail.elt.classList.contains("profile-btn")) return;
        document.querySelectorAll(".profile-btn").forEach(function (b) {
            b.classList.remove("active");
        });
        e.detail.elt.classList.add("active");
    });

    // ── Dual-axis joystick ────────────────────────────────────────────────────
    function initJoysticks() {
        document.querySelectorAll(".joystick-outer").forEach(function (outer) {
            if (outer.dataset.joystickInit) return;
            outer.dataset.joystickInit = "1";
            var thumb = outer.querySelector(".joystick-thumb");
            var axisX = parseInt(outer.dataset.axisX);
            var axisY = parseInt(outer.dataset.axisY);
            var recenter = outer.dataset.recenter === "true";
            var outerR = outer.offsetWidth / 2;
            var thumbR = thumb.offsetWidth / 2;
            var maxDist = outerR - thumbR;
            var dragging = false;

            function moveThumb(x, y) {
                var dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) { x = x / dist * maxDist; y = y / dist * maxDist; }
                thumb.style.transform = "translate(" + x + "px," + y + "px)";
                postAxis(axisX,  x / maxDist);
                postAxis(axisY,  y / maxDist);
            }

            thumb.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                thumb.setPointerCapture(e.pointerId);
                dragging = true;
            });
            thumb.addEventListener("pointermove", function (e) {
                if (!dragging) return;
                var r = outer.getBoundingClientRect();
                moveThumb(e.clientX - r.left - outerR, e.clientY - r.top - outerR);
            });
            function endDrag() {
                if (!dragging) return;
                dragging = false;
                if (recenter) moveThumb(0, 0);
            }
            thumb.addEventListener("pointerup",     endDrag);
            thumb.addEventListener("pointercancel", endDrag);

            var resetBtn = outer.parentElement.querySelector(".joystick-reset-btn");
            if (resetBtn) resetBtn.addEventListener("click", function () { moveThumb(0, 0); });
        });
    }

    document.body.addEventListener("htmx:afterSwap", function (e) {
        if (e.detail.target.id === "controls") initJoysticks();
    });

    // ── Spring slider spring-back ─────────────────────────────────────────────
    var _springActive = null;
    document.addEventListener("pointerdown", function (e) {
        if (e.target.classList.contains("spring-slider")) {
            _springActive = e.target;
        }
    });
    document.addEventListener("pointerup", function () {
        if (!_springActive) return;
        var s = _springActive;
        _springActive = null;
        var d = parseFloat(s.dataset.default);
        var ax = parseInt(s.dataset.axis);
        setTimeout(function () {
            s.value = d;
            postAxis(ax, d);
            s.nextElementSibling.textContent = d.toFixed(3);
        }, 0);
    });

    // ── Joystick helpers (called from server-rendered inline handlers) ─────────
    function post(payload) {
        fetch("/joystick", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    }
    function postAxis(idx, val) {
        post({ type: "axis", index: idx, value: parseFloat(val) });
    }
    function postBtn(idx, val) {
        post({ type: "button", index: idx, value: val });
    }
</script>
</body>
</html>
